<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="../favicon.png">
    <title>Amigos de la inform&aacute;tica</title>
</head>
<body>

<header>
    <h1>Cuestionario para formar parte del club &quot;Amigos de la inform&aacute;tica&quot;</h1>
</header>

<main>
    <form action="#" method="post">
        <fieldset>
            <legend>Datos personales</legend>

            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">
            </p>
            <p>
                <label for="domicilio">Domicilio:</label>
                <input type="text" id="domicilio" name="domicilio" placeholder="Calle, n&uacute;mero y localidad">
            </p>
            <p>
                <label for="pais">Pa&iacute;s de origen:</label>
                <select id="pais" name="pais">
                    <option value="espana" selected>Espa&ntilde;a</option>
                    <option value="peru">Per&uacute;</option>
                    <option value="portugal">Portugal</option>
                    <option value="otro">Otro</option>
                </select>
            </p>
            <p>
                <label for="fecha-nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
            </p>
            <p>
                <label for="correo">Correo electr&oacute;nico:</label>
                <input type="email" id="correo" name="correo">
            </p>
            <p>
                <label for="telefono">Tel&eacute;fono:</label>
                <input type="tel" id="telefono" name="telefono">
            </p>
            <fieldset>
                <legend>Estado civil</legend>
                <input type="radio" id="soltero" name="estado-civil" value="soltero">
                <label for="soltero">Soltero/a</label>
                <input type="radio" id="casado" name="estado-civil" value="casado">
                <label for="casado">Casado/a</label>
                <input type="radio" id="separado" name="estado-civil" value="separado">
                <label for="separado">Separado/a</label>
                <input type="radio" id="viudo" name="estado-civil" value="viudo">
                <label for="viudo">Viudo/a</label>
            </fieldset>
            <fieldset>
                <legend>Sexo</legend>
                <input type="radio" id="hombre" name="sexo" value="hombre">
                <label for="hombre">Hombre</label>
                <input type="radio" id="mujer" name="sexo" value="mujer">
                <label for="mujer">Mujer</label>
            </fieldset>
        </fieldset>

        <fieldset>
            <legend>Otra informaci&oacute;n de inter&eacute;s</legend>

            <p>
                <label for="dispositivos">Selecciona los componentes electr&oacute;nicos con los que habitualmente trabajas:</label><br>
                <select id="dispositivos" name="dispositivos" multiple size="4">
                    <option value="movil">M&oacute;vil</option>
                    <option value="tablet">Tablet</option>
                    <option value="ordenador">Ordenador</option>
                    <option value="ebook">Ebook</option>
                </select>
            </p>

            <fieldset>
                <legend>Selecciona tus actividades favoritas</legend>
                <input type="checkbox" id="deporte" name="actividad-deporte" value="deporte">
                <label for="deporte">Hacer deporte</label>
                <input type="checkbox" id="amigos" name="actividad-amigos" value="amigos">
                <label for="amigos">Salir con mis amigos</label>
                <input type="checkbox" id="series" name="actividad-series" value="series">
                <label for="series">Ver series, pel&iacute;culas...</label>
                <input type="checkbox" id="senderismo" name="actividad-senderismo" value="senderismo">
                <label for="senderismo">Realizar rutas de senderismo</label>
                <input type="checkbox" id="cine" name="actividad-cine" value="cine">
                <label for="cine">Ir al cine</label>
                <input type="checkbox" id="musica" name="actividad-musica" value="musica">
                <label for="musica">Escuchar m&uacute;sica</label>
            </fieldset>

            <p>
                <label for="motivo">Explica brevemente el motivo por el que deseas ingresar en nuestro club:</label><br>
                <textarea id="motivo" name="motivo" rows="4" cols="50"></textarea>
            </p>
            <p>
                <label for="pelicula">Elige o escribe tu pel&iacute;cula favorita:</label>
                <input type="text" id="pelicula" name="pelicula">
            </p>
        </fieldset>

        <p>
            <button type="submit">Enviar</button>
            <button type="reset">Cancelar</button>
        </p>
    </form>

    <p><a href="../formularios.html">Volver a formularios</a></p>
    <p><a href="../index.html">Men&uacute; principal</a></p>
</main>

</body>
</html>
