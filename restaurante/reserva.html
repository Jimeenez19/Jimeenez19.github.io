<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>Formulario de reserva | Restaurante Anto&ntilde;ito</title>
</head>
<body>

<header>
    <h1>Haz una reserva</h1>
</header>

<nav>
    <a href="index.html">Inicio del restaurante</a> |
    <a href="../index.html">Men&uacute; principal</a>
</nav>

<main>
    <form action="#" method="post">
        <fieldset>
            <legend>Datos de la reserva</legend>
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required>
            </p>
            <p>
                <label for="clientes">N&uacute;mero de clientes:</label>
                <input type="number" id="clientes" name="clientes" min="1" required>
            </p>
            <p>
                <label for="correo">Correo electr&oacute;nico:</label>
                <input type="email" id="correo" name="correo" autocomplete="email" required>
            </p>
            <p>
                <label for="telefono">Tel&eacute;fono:</label>
                <input type="tel" id="telefono" name="telefono" autocomplete="tel">
            </p>
            <p>
                <label for="fecha">Fecha de la reserva:</label>
                <input type="date" id="fecha" name="fecha" required>
            </p>
            <p>
                <label for="hora">Hora de la reserva:</label>
                <input type="time" id="hora" name="hora" required>
            </p>
            <p>
                <label for="mensaje">Mensaje:</label><br>
                <textarea id="mensaje" name="mensaje" rows="5" cols="50"></textarea>
            </p>
        </fieldset>
        <p>
            <button type="submit">Solicitar reserva</button>
            <button type="reset">Cancelar</button>
        </p>
    </form>
</main>

<footer>
    <p><a href="index.html">Volver al restaurante</a></p>
</footer>

</body>
</html>
