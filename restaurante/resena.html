<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>Formulario de rese&ntilde;a | Restaurante Anto&ntilde;ito</title>
</head>
<body>

<header>
    <h1>Escribe una rese&ntilde;a</h1>
</header>

<nav>
    <a href="../index.html">Men&uacute; principal</a>
</nav>

<main>
    <form action="#" method="post">
        <fieldset>
            <legend>Tu rese&ntilde;a</legend>
            <p>
                <label for="plato">Elige un plato:</label>
                <select id="plato" name="plato" required>
                    <option value="" selected disabled>Selecciona un plato</option>
                    <option value="tortilla">Tortilla de Patatas</option>
                    <option value="paella">Paella Valenciana</option>
                    <option value="gazpacho">Gazpacho Cordob&eacute;s</option>
                </select>
            </p>
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" autocomplete="name" required>
            </p>
            <p>
                <label for="resena">Rese&ntilde;a del plato:</label><br>
                <textarea id="resena" name="resena" rows="6" cols="50" required></textarea>
            </p>
        </fieldset>
        <p>
            <button type="submit">Enviar rese&ntilde;a</button>
            <button type="reset">Cancelar</button>
        </p>
    </form>
</main>

<footer>
    <p><a href="index.html">Volver al restaurante</a></p>
</footer>

</body>
</html>
