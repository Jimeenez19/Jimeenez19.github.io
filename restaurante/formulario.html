<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Antonio Javier Jimenez Merino">
    <meta name="description" content="Formulario de inscripcion en ciclos formativos de grado superior.">
    <title>Formulario de inscripcion</title>
</head>
<body>

<header>
    <h1>Hoja de inscripci&oacute;n</h1>
</header>

<main>
    <form action="#" method="post">
        <fieldset>
            <legend>Datos personales</legend>

            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre">

                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos">

                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni">
            </p>

            <p>
                <label for="localidad">Localidad de nacimiento:</label>
                <input type="text" id="localidad" name="localidad">

                <label for="provincia">Provincia:</label>
                <input type="text" id="provincia" name="provincia" value="Huelva">

                <label for="fecha-nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">
            </p>

            <p>
                <label for="direccion">Direcci&oacute;n:</label>
                <input type="text" id="direccion" name="direccion">

                <label for="codigo-postal">C&oacute;digo postal:</label>
                <input type="text" id="codigo-postal" name="codigo-postal" inputmode="numeric">
            </p>
        </fieldset>

        <fieldset>
            <legend>Forma de acceso</legend>

            <p>
                <input type="radio" id="acceso-directo" name="forma-acceso" value="directo">
                <label for="acceso-directo">Directo</label>
            </p>
            <ul>
                <li>
                    <input type="radio" id="bachillerato" name="forma-acceso" value="bachillerato">
                    <label for="bachillerato">Bachillerato Log. Modalidad</label>
                    <input type="text" name="modalidad-bachillerato" aria-label="Modalidad de bachillerato">
                </li>
                <li>
                    <input type="radio" id="experimental" name="forma-acceso" value="experimental">
                    <label for="experimental">Experimental</label>
                </li>
                <li>
                    <input type="radio" id="cou" name="forma-acceso" value="cou">
                    <label for="cou">COU Opci&oacute;n</label>
                    <input type="text" name="opcion-cou" aria-label="Opcion de COU">
                </li>
                <li>
                    <input type="radio" id="fp2" name="forma-acceso" value="fp2">
                    <label for="fp2">FP2</label>
                </li>
                <li>
                    <input type="radio" id="otros-estudios" name="forma-acceso" value="otros">
                    <label for="otros-estudios">Otros (especifique)</label>
                    <input type="text" name="otros-estudios-detalle" aria-label="Especifique otros estudios">
                </li>
            </ul>

            <p>
                <input type="radio" id="prueba-libre" name="forma-acceso" value="prueba-libre">
                <label for="prueba-libre">Prueba libre</label>
            </p>
        </fieldset>

        <fieldset>
            <legend>Documentos adjuntados</legend>

            <p>
                <input type="checkbox" id="documento-dni" name="documentos" value="dni">
                <label for="documento-dni">Fotocopia DNI</label>

                <input type="checkbox" id="certificado" name="documentos" value="certificado">
                <label for="certificado">Certificado acad&eacute;mico</label>
            </p>
            <p>
                <input type="checkbox" id="otros-documentos" name="documentos" value="otros">
                <label for="otros-documentos">Otros documentos (especifique)</label>
                <input type="text" name="otros-documentos-detalle" aria-label="Especifique otros documentos">
            </p>
        </fieldset>

        <p>
            <button type="submit">Enviar solicitud</button>
            <button type="reset">Limpiar datos</button>
        </p>
    </form>
    <p><a href="../index.html">Men&uacute; principal</a></p>
</main>

</body>
</html>
